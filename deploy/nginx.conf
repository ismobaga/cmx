# Crommix AI static site (ai.crommixmali.com). TLS is terminated by Dokploy's Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # "/lid" -> "/lid/" without leaking http:// behind the HTTPS proxy

    # Compress text, JS and the JSON models (2 MB -> ~410 KB for cmx-lid).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. Keep ALL add_header lines here: nginx drops server-level
    # add_header in any location that declares its own. Caching uses `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    # Everything is same-origin; models run in the page, nothing is sent out.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    # Pages: always revalidate so a new deploy shows up immediately.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
    }

    # Code, styles and models: cache a day, then revalidate (ETag).
    location ~* \.(js|css|json|svg|png|webmanifest|wasm|onnx|bin)$ {
        try_files $uri =404;
        expires 1d;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
